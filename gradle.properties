org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP2 (the default since KSP 2.0.x) has a known bug processing Room's generated
# suspend-fun-returning-Unit DAO methods: "unexpected jvm signature V". Falling back to the
# older, more stable KSP1 engine avoids it.
ksp.useKSP2=false
