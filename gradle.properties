# Not forcing ksp.useKSP2=false here: KSP 2.3.x removed KSP1 entirely and hard-errors if this
# is set. An earlier KSP2 release had a real bug with Room's Unit-returning suspend DAO
# methods ("unexpected jvm signature V") that this property worked around — if it resurfaces
# on this KSP version, revisit with a different fix (e.g. a KSP/Room version pairing known to
# avoid it), not this property.
