name: Build debug APK

# Builds an installable (sideload) debug APK on every push to main and
# publishes it to a "latest" GitHub Release — the actual real Android
# download link, since there's no Play Store listing. This is a debug
# build (unsigned release signing isn't set up), which is the honest
# thing to ship without a managed keystore.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Android SDK setup step: ubuntu-latest's runner image ships with the SDK,
      # platform 34, and build-tools already installed (and ANDROID_HOME already set).
      # android-actions/setup-android@v3 was tried here first and crashed trying to
      # install the legacy "tools" package, which Google removed from the SDK years
      # ago — that action is unmaintained for current SDK manager behavior.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.12.0 needs a newer Gradle than 8.11.1 — using 8.14.4, which Kotlin's own
          # build output confirmed is a real current release (it's the version Kotlin 2.5.0
          # will require as its own minimum).
          gradle-version: "8.14.4"

      - name: Write Spotify Client ID
        # SPOTIFY_CLIENT_ID is a repo secret set under Settings > Secrets and
        # variables > Actions. Without it, the build still succeeds — the
        # Playlists tab just shows "no Spotify Client ID configured".
        run: echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" >> local.properties

      - name: Write Google Web Client ID
        # GOOGLE_WEB_CLIENT_ID is a repo secret (Settings > Secrets and variables >
        # Actions) — the "Web client ID" shown in Firebase console > Authentication >
        # Sign-in method > Google, once that provider is enabled. Without it, the build
        # still succeeds — the Account screen's Google button just shows "not configured".
        run: echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk focuslens-debug.apk

      - name: Publish to the "debug-build" release
        # The tag must NOT be literally "latest": GitHub's /releases/latest/download/
        # convenience redirect gets ambiguous and 404s when a real tag is also named
        # "latest" (seen in production — this is the fix). Use a different tag name and
        # link to it directly with /releases/download/<tag>/<file>, which always resolves.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: Latest build
          body: Automatically built from the latest commit on main. Debug build — unsigned, for sideloading only.
          files: focuslens-debug.apk
          make_latest: "true"
