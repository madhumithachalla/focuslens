name: Build debug APK

# Builds an installable (sideload) debug APK on every push to main and
# publishes it as a static file under docs/ (served by GitHub Pages) —
# the actual real Android download link, since there's no Play Store
# listing and this repo is private (GitHub Release assets need a
# logged-in collaborator, so they 404 for anyone else). This is a debug
# build (unsigned release signing isn't set up), which is the honest
# thing to ship without a managed keystore.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No Android SDK setup step: ubuntu-latest's runner image ships with the SDK,
      # platform 34, and build-tools already installed (and ANDROID_HOME already set).
      # android-actions/setup-android@v3 was tried here first and crashed trying to
      # install the legacy "tools" package, which Google removed from the SDK years
      # ago — that action is unmaintained for current SDK manager behavior.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.12.0 needs a newer Gradle than 8.11.1 — using 8.14.4, which Kotlin's own
          # build output confirmed is a real current release (it's the version Kotlin 2.5.0
          # will require as its own minimum).
          gradle-version: "8.14.4"

      - name: Write Spotify Client ID
        # SPOTIFY_CLIENT_ID is a repo secret set under Settings > Secrets and
        # variables > Actions. Without it, the build still succeeds — the
        # Playlists tab just shows "no Spotify Client ID configured".
        run: echo "SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}" >> local.properties

      - name: Write Google Web Client ID
        # GOOGLE_WEB_CLIENT_ID is a repo secret (Settings > Secrets and variables >
        # Actions) — the "Web client ID" shown in Firebase console > Authentication >
        # Sign-in method > Google, once that provider is enabled. Without it, the build
        # still succeeds — the Account screen's Google button just shows "not configured".
        run: echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> local.properties

      - name: Write build number
        # github.run_number is a plain incrementing integer for this workflow, unique per
        # run — baked into this build as BuildConfig.BUILD_NUMBER, and published to
        # docs/version.txt below. The in-app update check (UpdateChecker.kt) compares the
        # two to tell whether a newer build than the one installed is live on the website.
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> local.properties

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk focuslens-debug.apk

      # GitHub Releases require the visitor to be authenticated to this repo — this repo is
      # private, so the public /releases/.../download/ links 404 for anyone but a logged-in
      # collaborator (that's what was actually happening, not a tag-name collision). Pages
      # (docs/) is the one thing here that's already reachable by a plain visitor, so ship the
      # APK as a plain static file there instead of as a Release asset.
      - name: Publish APK + version.txt into docs/ (served by GitHub Pages, no auth needed)
        run: |
          cp focuslens-debug.apk docs/focuslens-debug.apk
          echo "${{ github.run_number }}" > docs/version.txt
          # Publish commits are made as the owner, not as the Actions bot (see CLAUDE.md).
          git config user.name "madhumithachalla"
          git config user.email "mcha0218@student.monash.edu"
          git add docs/focuslens-debug.apk docs/version.txt
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "Publish latest debug APK to docs/ [skip ci]"
            for attempt in 1 2 3 4; do
              if git push -q origin HEAD:main; then break; fi
              # Another build published first: take the latest main and publish this build on top.
              git fetch -q origin main
              git reset -q --hard origin/main
              cp focuslens-debug.apk docs/focuslens-debug.apk
              echo "${{ github.run_number }}" > docs/version.txt
              git add docs/focuslens-debug.apk docs/version.txt
              git commit -qm "Publish latest debug APK to docs/ [skip ci]"
              sleep $((attempt * 3))
            done
          fi
