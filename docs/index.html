<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f2eb" />
  <title>FocusLens</title>
  <meta name="description" content="Journal, cycle tracking, to-do reflection, curated learning and reward suggestions — the FocusLens features that don't need a native app, for any browser on any device." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-top">
        <button type="button" id="nav-toggle" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nav">☰</button>
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 220 160" aria-hidden="true">
            <path d="M 5 80 C 10 68, 22 58, 40 56 C 55 54, 62 46, 72 36 C 95 16, 135 10, 168 22 C 198 33, 210 58, 200 82 C 193 98, 175 110, 155 113 C 130 117, 100 115, 78 104 C 58 95, 42 88, 30 86 C 20 85, 11 84, 5 80 Z" fill="#E6392B"/>
            <path d="M 70 40 C 80 32, 95 28, 108 30" fill="none" stroke="#E6392B" stroke-width="10" stroke-linecap="round"/>
            <circle cx="92" cy="52" r="14" fill="#1A0805"/>
            <circle cx="95" cy="54" r="8.2" fill="#E6392B"/>
            <circle cx="98.5" cy="50.5" r="2.4" fill="#1A0805"/>
          </svg>
          <img class="wordmark" src="wordmark.svg" alt="FocusLens" /><span class="brand-sub">web</span>
        </div>
        <div class="get-app" id="get-app">
          <a id="xp-pill" class="xp-pill" href="#progress" title="Your level and XP"></a>
          <button type="button" id="theme-toggle" class="icon-btn" aria-label="Change theme"></button>
          <button type="button" id="auth-trigger">Sign in</button>
          <button type="button" id="install-btn" hidden>Install app</button>
          <a id="android-link" class="get-app-link" href="https://madhumithachalla.github.io/focuslens/focuslens-debug.apk" target="_blank" rel="noopener">Android APK ↓</a>
        </div>
      </div>
    </header>
    <div id="ios-install-tip" class="ios-install-tip" hidden>
      <p>Add FocusLens to your home screen: tap the Share icon, then "Add to Home Screen".</p>
      <button type="button" id="ios-install-dismiss">Got it</button>
    </div>
    <div class="shell">
      <aside id="sidebar" class="sidebar"><nav id="nav" class="nav" aria-label="Main"></nav></aside>
      <main id="page" class="page"></main>
    </div>
  </div>
  <div id="auth-modal" class="modal-overlay" hidden>
    <div class="modal-card">
      <button type="button" id="auth-modal-close" class="modal-close" aria-label="Close">×</button>
      <div id="auth-modal-body"></div>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
